services:
  postgres:
    image: postgres:16-alpine
    container_name: faheem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: faheem
      POSTGRES_PASSWORD: faheem_dev_password
      POSTGRES_DB: faheem_db
    ports:
      - "5432:5432"
    volumes:
      - faheem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faheem -d faheem_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faheem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  faheem_pgdata:
